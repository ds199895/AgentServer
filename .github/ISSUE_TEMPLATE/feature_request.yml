name: 功能建议
description: 提议新的能力、交互或工程改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前限制和真实使用场景，避免只描述一个实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、交互或 API。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 终端与分屏
        - 设备与 FRP
        - 工作区与 Artifact
        - 服务预览
        - 前端交互
        - 部署与运维
        - 文档与开发体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性或部署影响
      description: 是否涉及配置、数据库、协议、安全边界或向后兼容性。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和 Roadmap，确认没有重复建议。
          required: true
        - label: 我愿意参与讨论、测试或实现（非必选）。
