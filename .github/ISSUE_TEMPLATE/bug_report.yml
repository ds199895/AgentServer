name: 问题报告
description: 报告可以稳定复现的错误或行为异常
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要填写此表单，请使用 Security 页面私下报告。
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: AgentServer commit SHA、Release 版本或部署时间。
      placeholder: 例如 65d984f 或 v1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、Python、Node.js、frp 版本及部署方式。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 只提供已脱敏内容；不要粘贴 Token、密码、Cookie、私钥或真实生产配置。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我已移除所有敏感信息。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
