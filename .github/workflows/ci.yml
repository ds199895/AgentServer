name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Match the production host so bundled binary wheels are compatible.
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run terminal layout contracts
        run: npm --prefix frontend run test:layout
      - name: Build frontend
        env:
          AGENTSERVER_BUILD_SHA: ${{ github.sha }}
        run: npm --prefix frontend run build
      - name: Check shell scripts and whitespace
        run: |
          bash -n scripts/*.sh
          git diff --check
      - name: Install browser-test dependencies
        run: npm --prefix e2e ci
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Start integration server
        env:
          ADMIN_PASSWORD: e2e-test-password
          DATA_DIR: /tmp/agentserver-ci-data
          WEB_DIST: frontend/dist
          AGENTSERVER_BUILD_SHA: ${{ github.sha }}
          ENABLE_LOCAL_TERMINALS: '1'
          TERMINAL_CMD: /bin/sh
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18124 >/tmp/agentserver-ci.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18124/api/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agentserver-ci.log
          exit 1
      - name: Run terminal compatibility regression
        run: npm --prefix e2e run contract

  build-release:
    name: build release
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Download wheels for the same interpreter used in production.
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build immutable release
        env:
          BUNDLE_PYTHON_WHEELS: '1'
        run: scripts/build_release.sh
      - id: metadata
        name: Record artifact metadata
        run: echo "artifact-name=agentserver-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            dist/agentserver-*.tar.gz
            dist/agentserver-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy-production:
    name: deploy production
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs:
      - verify
      - build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agentserver-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PROD_BASE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.artifact-name }}
          path: release
      - name: Verify downloaded artifact
        run: |
          cd release
          checksum_file=$(find . -maxdepth 1 -name 'agentserver-*.tar.gz.sha256' -print -quit)
          test -n "$checksum_file"
          sha256sum -c "${checksum_file#./}"
      - name: Configure restricted production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/agentserver_deploy"
          chmod 0600 "$HOME/.ssh/agentserver_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact verified release
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ vars.PROD_SSH_USER }}
        run: |
          ssh_base=(
            ssh
            -i "$HOME/.ssh/agentserver_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -p "$PROD_SSH_PORT"
            "$PROD_SSH_USER@$PROD_HOST"
          )
          stream_file="$RUNNER_TEMP/agentserver-deploy-stream.tar.gz"
          chunks_dir="$RUNNER_TEMP/agentserver-deploy-chunks"
          tar -C release -czf "$stream_file" .
          archive_sha=$(sha256sum "$stream_file" | awk '{print $1}')
          mkdir -p "$chunks_dir"
          split -b 1M -d -a 6 "$stream_file" "$chunks_dir/chunk-"
          export chunks_dir GITHUB_SHA
          export PROD_SSH_PORT PROD_SSH_USER PROD_HOST
          printf '%s\0' "$chunks_dir"/chunk-* | xargs -0 -n 1 -P 6 bash -c '
            chunk=$1
            index=${chunk##*-}
            chunk_sha=$(sha256sum "$chunk" | awk "{print \$1}")
            cat "$chunk" | ssh \
              -i "$HOME/.ssh/agentserver_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -p "$PROD_SSH_PORT" \
              "$PROD_SSH_USER@$PROD_HOST" \
              "chunk $GITHUB_SHA $index $chunk_sha"
          ' _
          chunk_count=$(find "$chunks_dir" -maxdepth 1 -name 'chunk-*' | wc -l | tr -d ' ')
          "${ssh_base[@]}" "finalize $GITHUB_SHA $chunk_count $archive_sha"
      - name: Verify public production version
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          for attempt in $(seq 1 20); do
            payload=$(curl -fsS --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache' "$PROD_BASE_URL/api/version" || true)
            if python3 -c 'import json,sys; raise SystemExit(json.loads(sys.argv[1]).get("build_sha") != sys.argv[2])' \
              "$payload" "$GITHUB_SHA" 2>/dev/null; then
              echo "Production is running $GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "Production version did not converge to $GITHUB_SHA" >&2
          exit 1
